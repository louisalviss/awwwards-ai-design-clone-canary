name: Awwwards A/B visual comparison
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate and baseline
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/b-site.log 2>&1 &
          echo $! > /tmp/b-site.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 -m http.server 4174 --bind 127.0.0.1 --directory baseline-site >/tmp/base-site.log 2>&1 &
            echo $! > /tmp/base-site.pid
            for i in {1..20}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 0.5; done
            curl -fsS http://127.0.0.1:4174/ >/dev/null
            echo "BASELINE_URL=http://127.0.0.1:4174/" >> "$GITHUB_ENV"
          fi
      - name: Capture 12 A/B checkpoints
        run: node tools/capture-ab.mjs ab-output
      - name: Score checkpoints and build repair context
        run: python3 tools/score-ab.py ab-output | tee ab-output/summary.stdout.txt
      - name: Print acceptance gate
        run: cat ab-output/gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: awwwards-ab-visual-proof
          path: ab-output
          retention-days: 7
